<!doctype html><title>WebGL timing control</title><style>body{background:#101820;color:#eef;font:16px system-ui}canvas{width:801px;height:775px}pre{white-space:pre-wrap}</style><h1>WebGL timing control</h1><button id="reset">Reset measurements</button><pre id="stats"></pre><canvas id="gl" width="801" height="775"></canvas><script>
const gl=document.querySelector('canvas').getContext('webgl2');const ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');let qs=[],samples=[],frames=[],last=0,next=0;document.querySelector('#reset').onclick=()=>{samples=[];frames=[];last=0};function loop(t){requestAnimationFrame(loop);if(t<next-2.5)return;next=t-next>33.3||next===0?t+16.6667:next+16.6667;if(last)frames.push(t-last);last=t;const q=ext&&qs.length<5?gl.createQuery():null;if(q)gl.beginQuery(ext.TIME_ELAPSED_EXT,q);gl.clearColor(.07,.12,.2,1);gl.clear(gl.COLOR_BUFFER_BIT);if(q){gl.endQuery(ext.TIME_ELAPSED_EXT);qs.push(q)}while(qs.length&&gl.getQueryParameter(qs[0],gl.QUERY_RESULT_AVAILABLE)){let q=qs.shift();if(!gl.getParameter(ext.GPU_DISJOINT_EXT))samples.push(gl.getQueryParameter(q,gl.QUERY_RESULT)/1e6);gl.deleteQuery(q)}if(samples.length>600)samples.shift();if(frames.length>600)frames.shift();}requestAnimationFrame(loop);setInterval(()=>{let a=[...samples].sort((a,b)=>a-b);document.querySelector('#stats').textContent=JSON.stringify({timerAvailable:!!ext,gpuMedianMs:a[Math.floor(a.length*.5)],gpuP95Ms:a[Math.floor(a.length*.95)],presentMeanMs:frames.reduce((a,b)=>a+b,0)/frames.length,sampleCount:a.length,canvas:[801,775],visibility:document.visibilityState},null,2)},500)
</script>
