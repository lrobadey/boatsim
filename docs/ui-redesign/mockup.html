<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HUD mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter+Tight:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet" />
<style>
/* Tokens copied from src/ui/style.css, plus the proposed legibility floor. */
:root {
  --bone: #f3eee4; --t1: #f3eee4; --t2: rgba(243,238,228,.78); --t3: rgba(243,238,228,.5); --t4: rgba(243,238,228,.22);
  --terra: #d0693e; --bronze: #d2a65e; --bronze-hi: #f0cf8f; --bronze-lo: #7a5a2a;
  --fair: #8fcb9b; --caution: #e8a25a; --danger: #e36a4b;
  --glass: rgba(10,16,24,.5); --hair: rgba(243,238,228,.12);
  --radius: 12px; --blur: blur(14px) saturate(1.15); --lift: 0 8px 28px rgba(0,0,0,.25);
  --text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.6), 0 0 20px rgba(0,0,0,.4);
  --f-ui: 'Inter Tight', system-ui, sans-serif; --f-name: 'Cormorant Garamond', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b121a; color: var(--t1); font: 400 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }

/* page chrome (not part of the HUD) */
.bar { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
.bar h1 { font: 500 22px var(--f-name); margin: 0 8px 0 0; }
.tabs { display: flex; gap: 4px; background: rgba(243,238,228,.06); padding: 3px; border-radius: 999px; }
.tabs button, .chip { font: 500 13px var(--f-ui); color: var(--t2); background: none; border: 0; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.tabs button.on { background: var(--bone); color: #0b121a; }
.chip { border: 1px solid var(--hair); }
.chip.on { color: var(--t1); border-color: var(--bronze); }
.keys { color: var(--t3); font-size: 12.5px; margin-left: auto; }
.wrap { flex: 1; display: flex; min-height: 0; }
.viewport { flex: 1; position: relative; min-width: 0; }
.notes { width: 300px; border-left: 1px solid var(--hair); padding: 16px 18px; overflow: auto; font-size: 13px; color: var(--t2); }
.notes.off { display: none; }
.notes h2 { font: 500 20px var(--f-name); color: var(--t1); margin: 0 0 4px; }
.notes p.lead { margin: 0 0 14px; color: var(--t3); }
.notes ol { padding: 0; margin: 0; list-style: none; display: grid; gap: 12px; }
.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.notes li b { color: var(--t1); font-weight: 600; display: block; }
.pinno { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--bronze); color: #0b121a; font: 700 11px var(--f-ui); }
@media (max-width: 900px) { .notes { display: none; } .pin { display: none !important; } }

/* stage: a 1440x900 game frame scaled to fit */
.stage { position: absolute; left: 50%; top: 50%; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden; border-radius: 6px; background: #0b121a center/cover no-repeat; }
.pin { position: absolute; z-index: 20; transition: opacity .2s; }
.pins-off .pin { opacity: 0; }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; text-shadow: var(--text-shadow); }
.glass { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--lift); text-shadow: none; }
.label { font: 600 12px/1.2 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--t2); }
.num { font-variant-numeric: tabular-nums; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin: 0 2px; font: 600 11px/1 var(--f-ui); color: var(--t1); border: 1px solid rgba(243,238,228,.32); border-bottom-width: 2px; border-radius: 4px; background: rgba(10,16,24,.35); text-shadow: none; }
.fade { transition: opacity .5s, transform .5s; }

/* top left: time and sky */
.sky { position: absolute; left: 32px; top: 26px; display: flex; align-items: center; gap: 12px; }
.sky .t { font: 300 22px var(--f-ui); }
.sky .h { font-size: 13px; color: var(--t3); margin-top: 2px; }
.sky .h kbd { margin-left: 0; }

/* top centre: heading tape */
.tape { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; }
.tape canvas { width: 460px; height: 40px; }
.tape .row { display: flex; align-items: baseline; gap: 14px; }
.tape .hdg { font: 400 20px var(--f-ui); }
.tape .wind { font-size: 14px; color: var(--t2); display: flex; align-items: center; gap: 6px; }
.tape .wind i { width: 7px; height: 7px; border-radius: 50%; background: var(--bronze); display: inline-block; }

/* top right: minimap */
.map { position: absolute; right: 26px; top: 16px; width: 148px; height: 148px; }

/* bottom panels */
.panel { position: absolute; bottom: 30px; width: 252px; padding: 14px 16px 14px; }
.panel.left { left: 32px; }
.panel.right { right: 32px; }
.phead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.status { font: 500 15px var(--f-ui); }
.status.luff { color: var(--caution); }
.status.aback { color: var(--danger); }
.sub { font-size: 12.5px; color: var(--t3); }
.dial { display: block; width: 220px; height: 220px; margin: 0 auto; }
.meter { display: grid; grid-template-columns: 44px 1fr 58px; align-items: center; gap: 8px; font-size: 13px; color: var(--t2); margin-top: 6px; }
.meter .v { text-align: right; color: var(--t1); font-size: 14px; }
.track { position: relative; height: 6px; border-radius: 3px; background: rgba(243,238,228,.12); overflow: visible; }
.track .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--t3); }
.track .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--bronze-lo), var(--bronze-hi)); }
.track .fill.neg { background: var(--danger); }
.track .fill.side { background: rgba(243,238,228,.55); }
.datarow { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--t2); }
.datarow b { color: var(--t1); font-weight: 500; }

/* oar panel */
.ladder { display: grid; gap: 3px; margin: 6px 0 10px; }
/* oar instruments */
.oarsvg { display: block; width: 232px; margin: 2px auto 0; overflow: visible; }
.ordrow { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
.ordname { font: 500 24px var(--f-name); letter-spacing: .01em; }
.ordname.ram { color: var(--danger); }
.ordname.back { color: var(--caution); }
.pips { display: flex; gap: 5px; }
.pips i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid rgba(210,166,94,.6); }
.pips i.on { background: var(--bronze); box-shadow: 0 0 6px rgba(210,166,94,.6); }
.pips i.ram.on { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 6px var(--danger); }
.pips i.hide { display: none; }
.v-tele .pips { display: none; }

/* antique finish */
.antique .glass { background: linear-gradient(180deg, rgba(20,17,14,.62), rgba(10,10,11,.6)); border-color: rgba(205,182,140,.18); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
/* no cards: instruments sit on the scene; an edgeless vignette carries legibility */
.antique .panel.glass, .antique .dock.glass, .antique .event.glass { background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  text-shadow: var(--text-shadow); }
.antique .panel { padding: 0; }
.antique .panel.left { left: 36px; bottom: 34px; }
.antique .panel.right { right: 36px; bottom: 34px; }
.antique .dial { width: 236px; height: 236px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
.antique .oarsvg { width: 252px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.5)); }
.antique .phead { padding: 0 2px; margin: 6px 0 2px; }
.antique .panel:not(.compact), .antique .panel .full { display: flex; flex-direction: column; }
.antique #sail .phead { order: 2; }
.antique #sail .dial { order: 1; }
.antique #sail .meter, .antique #sail .datarow { order: 3; }
.antique #oars .full .phead { order: 2; }
.antique #oars .full .oarsvg { order: 1; }
.antique #oars .full .ordrow { order: 2; margin-top: -4px; }
.antique #oars .full .stam { order: 3; }
.antique .label { color: #e2cfa6; }
.antique .meter, .antique .datarow, .antique .stam .top { color: rgba(241,232,214,.88); }
.antique .dock .g .gl { color: rgba(241,232,214,.9); }
.antique .meter, .antique .datarow, .antique .stam { padding: 0 2px; }
.antique .datarow { border-top-color: rgba(205,182,140,.22); }
.antique .event { font-size: 22px; }
.antique .label { font: 500 11px/1.1 var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: #cdb68c; }
.antique .status { font: 500 20px var(--f-name); color: #f1e8d6; }
.antique .event { font: 500 20px var(--f-name); letter-spacing: .01em; }
.antique .meter, .antique .datarow, .antique .stam .top, .antique .helm { color: rgba(236,222,196,.8); }
.antique .track, .antique .g .gt { height: 5px; border-radius: 3px; background: linear-gradient(180deg, #050403, #1a140d); box-shadow: inset 0 1.5px 3px rgba(0,0,0,.9), 0 1px 0 rgba(240,207,143,.18); }
.antique .track .fill { top: 1px; bottom: 1px; border-radius: 2px; background: linear-gradient(180deg, #e9d8b4, #a88a5a); box-shadow: none; }
.antique .track .fill.neg { background: linear-gradient(180deg, #e98a72, #9c3420); }
.antique .track .fill.side { background: linear-gradient(180deg, #e9d8b4, #a88a5a); opacity: .45; }
.antique .stam .track .fill { background: linear-gradient(180deg, #f1e8d6, #b9a888); }
.antique .stam.low .track .fill { background: linear-gradient(180deg, #ffb39c 0%, #c8432a 40%, #6e160a 100%); }
.antique .track .zero { background: #d9b46e; box-shadow: 0 0 2px #000; }
.antique .g .band { top: 1.5px; bottom: 1.5px; background: linear-gradient(180deg, rgba(160,220,170,.45), rgba(70,130,85,.45)); border-color: rgba(183,230,192,.7); }
.antique .g .nd { width: 2px; top: -5px; height: 15px; background: linear-gradient(90deg, #7a5320, #fff1cc 45%, #b98a45); box-shadow: 1px 2px 2px rgba(0,0,0,.7); }
.antique .g.bad .nd { background: linear-gradient(90deg, #6e160a, #ffb39c 45%, #c8432a); }
.antique .tape .hdg { font-weight: 300; }
.antique .sky .t { font: 500 26px var(--f-name); }

.rung { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--t3); padding: 3px 8px; border-radius: 6px; }
.rung i { width: 6px; height: 6px; border-radius: 50%; background: var(--t4); }
.rung.on { color: var(--t1); background: rgba(208,105,62,.18); }
.rung.on i { background: var(--terra); box-shadow: 0 0 8px var(--terra); }
.rung.hide { display: none; }
.rate { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.rate b { font: 400 22px var(--f-ui); }
.beat { width: 10px; height: 10px; border-radius: 50%; background: var(--terra); opacity: .15; transition: opacity .08s; }
.beat.hit { opacity: 1; transition: none; }
.stam { margin-top: 10px; }
.stam .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--t2); margin-bottom: 5px; }
.stam .track .fill { background: var(--bone); }
.stam.low .track .fill { background: var(--danger); }
.trend { font-size: 12px; margin-left: 6px; color: var(--t2); }
.trend.down { color: var(--caution); }
.trend.up { color: var(--fair); }
.panel.compact { padding: 10px 14px; }
.panel.compact .full { display: none; }
.panel:not(.compact) .mini { display: none; }
.mini { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

/* bottom centre: speed + helm */
.speed { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 6px; }
.speed b { font: 300 52px/1 var(--f-ui); }
.speed small { font-size: 16px; color: var(--t2); }
.speed .car { font-size: 15px; width: 14px; }
.speed .car.up { color: var(--fair); }
.speed .car.down { color: var(--caution); }
.depth { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); font-size: 14px; color: var(--t2); }
.depth b { color: var(--t1); font-weight: 500; }
.helm { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: 300px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 12.5px; color: var(--t2); }
.helm .bar2 { position: relative; height: 26px; }
.helm .line { position: absolute; left: 0; right: 0; top: 12px; height: 2px; background: rgba(243,238,228,.25); }
.helm .mid { position: absolute; left: 50%; top: 6px; width: 1px; height: 14px; background: var(--t3); }
.helm .turn { position: absolute; top: 11px; height: 4px; background: var(--bronze); border-radius: 2px; }
.helm .needle { position: absolute; top: 2px; width: 2px; height: 22px; background: var(--bronze-hi); margin-left: -1px; box-shadow: 0 0 6px var(--bronze); }
.helm .actual { position: absolute; top: 7px; width: 12px; height: 12px; margin-left: -6px; border: 1.5px solid var(--bone); border-radius: 50%; }
.helm .rt { position: absolute; left: 0; right: 0; top: -18px; text-align: center; color: var(--t2); font-size: 13px; }

/* event line */
.event { position: absolute; left: 50%; bottom: 186px; transform: translate(-50%, 8px); font: 500 16px var(--f-ui); opacity: 0; padding: 7px 16px; transition: opacity .3s, transform .3s; }
.event.show { opacity: 1; transform: translate(-50%, 0); }

/* dock card */
.dock { position: absolute; top: 104px; left: 50%; transform: translateX(-50%); width: 420px; text-align: center; }
.dhead { display: flex; justify-content: center; align-items: baseline; gap: 14px; }
.dhead .name { font: 500 26px var(--f-name); }
.dhead .num { color: var(--t2); font-size: 15px; }
.minis { display: flex; justify-content: center; gap: 18px; margin-top: 6px; }
.mini-g { width: 108px; height: 108px; overflow: visible; filter: drop-shadow(0 6px 12px rgba(0,0,0,.45)); }
.mini-g.pulse { animation: mpulse .6s 2; }
@keyframes mpulse { 50% { filter: drop-shadow(0 0 10px rgba(227,106,75,.95)); } }
.dock .phead .name { font: 500 24px var(--f-name); }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 8px; }
.g .gl { font-size: 12.5px; color: var(--t2); display: flex; justify-content: space-between; }
.g .gl b { color: var(--t1); font-weight: 500; font-size: 15px; }
.g .gt { position: relative; height: 8px; margin-top: 7px; border-radius: 4px; background: rgba(243,238,228,.1); }
.g .band { position: absolute; top: 0; bottom: 0; background: rgba(143,203,155,.35); border-left: 1px solid var(--fair); border-right: 1px solid var(--fair); }
.g .nd { position: absolute; top: -4px; width: 3px; height: 16px; margin-left: -1.5px; background: var(--bone); border-radius: 2px; }
.g.bad .gl b { color: var(--danger); }
.g.bad .nd { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.g.pulse .gt { animation: pulse .6s 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(227,106,75,.45); } }
.cta { margin-top: 12px; font-size: 14px; color: var(--t3); text-align: center; }
</style>
</head>
<body class="antique">
<div class="bar">
  <h1>HUD mockup</h1>
  <div class="tabs" id="tabs">
    <button data-s="trireme" class="on">Trireme under oars and sail</button>
    <button data-s="merchant">Merchant ship sailing</button>
    <button data-s="dock">Approaching a berth</button>
  </div>
  <button class="chip on" id="notesBtn">Notes</button>
  <button class="chip" id="eventBtn">Show an event</button>
  <button class="chip on" id="antBtn">Antique</button>
  <div class="keys"><kbd>J</kbd><kbd>L</kbd> trim yard · <kbd>K</kbd> crew trim · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>W</kbd><kbd>S</kbd> stroke order · <kbd>Space</kbd> hold water · <kbd>R</kbd> moor</div>
</div>
<div class="wrap">
  <div class="viewport" id="vp">
    <div class="stage" id="stage">
      <div class="hud">
        <div class="sky fade" data-k="sky">
          <svg width="64" height="64" viewBox="-34 -34 68 68">
            <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7fae"/><stop offset=".85" stop-color="#e2ad7c"/><stop offset="1" stop-color="#f0c08c"/></linearGradient><clipPath id="skc"><circle r="24"/></clipPath></defs>
            <circle r="31" cy="1.5" fill="#000" opacity=".5" filter="url(#castBig)"/>
            <circle r="26.5" fill="none" stroke="url(#brass)" stroke-width="3.5" filter="url(#metal)"/>
            <g clip-path="url(#skc)">
              <rect x="-24" y="-24" width="48" height="24" fill="url(#sk)"/>
              <rect x="-24" y="0" width="48" height="24" fill="url(#faceG)" filter="url(#faceGrain)"/>
              <circle cx="14" cy="-8" r="4.2" fill="#ffe7b4" filter="url(#cast)"/>
              <circle r="27" fill="none" stroke="#000" stroke-width="8" opacity=".6" filter="url(#innerShadow)"/>
            </g>
            <line x1="-24" x2="24" y1="0" y2="0" stroke="#cdb68c" stroke-width=".6"/>
            
          </svg>
          <div class="h"><kbd>?</kbd></div>
        </div>

        <div class="tape fade">
          <canvas id="tape" width="920" height="80"></canvas>
          <div class="row"><span class="hdg num" id="hdg">285°</span><span id="windTxt" style="display:none"></span></div>
        </div>

        <svg class="map" viewBox="-74 -74 148 148" style="overflow:visible">
          <defs><clipPath id="mapc"><circle r="58"/></clipPath></defs>
          <circle r="64" cy="2" fill="#000" opacity=".45" filter="url(#castBig)"/>
          <g clip-path="url(#mapc)">
            <circle r="58" fill="#0d1820"/><circle r="58" fill="rgba(120,170,190,.16)"/>
            <path d="M-70 -30 C-40 -42 -20 -20 4 -34 C20 -44 30 -60 40 -70 L-70 -70 Z" fill="#cdbb95" opacity=".35" stroke="#cdb68c" stroke-width=".5"/>
            <path d="M28 20 C40 10 56 18 70 8 L70 52 C52 48 36 40 28 20 Z" fill="#cdbb95" opacity=".35" stroke="#cdb68c" stroke-width=".5"/>
            <path d="M-46 30 C-38 24 -28 30 -30 40 C-34 48 -48 44 -46 30 Z" fill="#cdbb95" opacity=".35" stroke="#cdb68c" stroke-width=".5"/>
            <g id="mapShip" filter="url(#cast)"><path d="M0 -8 L5 6 L0 3 L-5 6 Z" fill="#d0693e"/></g>
            <circle r="62" fill="none" stroke="#000" stroke-width="10" opacity=".7" filter="url(#innerShadow)"/>
          </g>
          <circle r="61" fill="none" stroke="url(#brass)" stroke-width="5" filter="url(#metal)"/><circle r="58.4" fill="none" stroke="#000" stroke-width=".8"/><text y="-49" text-anchor="middle" font-size="7.5" letter-spacing="1" fill="#cdb68c" font-family="Inter Tight" font-weight="500">N</text>
        </svg>

        <div class="dock fade" id="dock">
          <div class="dhead"><span class="num">41 m</span></div>
          <div class="minis">
            <svg class="mini-g" id="mgSpeed" viewBox="-50 -50 100 100"></svg>
            <svg class="mini-g" id="mgOff" viewBox="-50 -50 100 100"></svg>
            <svg class="mini-g" id="mgAng" viewBox="-50 -50 100 100"></svg>
          </div>
          <div class="cta"><kbd>R</kbd></div>
        </div>

        <div class="panel left glass fade" id="sail">
          <svg class="dial" viewBox="-110 -110 220 220" id="dial">
            <defs><clipPath id="faceClip"><circle r="98"/></clipPath></defs>
            <circle r="104" cy="2" fill="#000" opacity=".45" filter="url(#castBig)"/>
            <circle r="101.5" fill="none" stroke="url(#brass)" stroke-width="5.5" filter="url(#metal)"/>
            <circle r="98.4" fill="none" stroke="#000" stroke-width="1"/>
            <circle r="98" fill="url(#faceG)" filter="url(#faceGrain)"/>

<script>
// ---------- scenes ----------
const SCENES = {

const ORDERS = [['Back water', -18, -0.35, 0.35], ['Oars up', 0, 0, 0], ['Slow', 18, 0.3, 0.2], ['Half', 26, 0.55, 0.42], ['Full', 31, 0.75, 0.7], ['Ramming speed', 46, 1.05, 1.25]];

// ---------- toy model (for the mockup only, not the game physics) ----------
const D2R = Math.PI / 180;
const S = { scene: 'trireme', trueFrom: 20, trueSpd: 8.7, heading: 280, speed: 2.6, helm: 0, helmAct: 0, yard: 0.5, yardT: 0.5, manual: false,
  order: 3, stamina: 0.82, stTrend: 0, accel: 0, phase: 0, gust: 0, keys: {}, drive: 0, side: 0, status: 'Full', heel: 0, lastSpd: 2.6, t: 0 };

function sailForces(yard, awFrom, awSpd) {
  // boat frame: x = starboard, y = forward
  const w = [-awSpd * Math.sin(awFrom), -awSpd * Math.cos(awFrom)];
  const n = [-Math.sin(yard), Math.cos(yard)];
  const wn = w[0] * n[0] + w[1] * n[1];
  const sinA = Math.abs(wn) / Math.max(awSpd, 0.01);
  let k = 0.028 * awSpd * wn;
  const luff = sinA < 0.14;
  if (luff) k *= sinA / 0.14;
  return { drive: k * n[1], side: k * n[0], luff, wn };
}
function crewTrim(awFrom, awSpd) {
  let best = S.yard, bs = -1e9;
  for (let y = -0.78; y <= 0.78; y += 0.02) {
    const f = sailForces(y, awFrom, awSpd); const s = f.drive - 0.35 * Math.abs(f.side);
    if (s > bs) { bs = s; best = y; }
  }
  return best;
}
function apparent() {
  const rel = (S.trueFrom - S.heading) * D2R;
  const spd = S.trueSpd * (1 + S.gust);
  const wx = -spd * Math.sin(rel), wy = -spd * Math.cos(rel) - S.speed;
  return { from: Math.atan2(-wx, -wy), spd: Math.hypot(wx, wy), rel };
}

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);

// dial ticks

const chev = (y, up = true) => `<path d="M-4.5 ${y + (up ? 2.2 : -2.2)} L0 ${y + (up ? -2.2 : 2.2)} L4.5 ${y + (up ? 2.2 : -2.2)}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>`;

];

const mgA = (g, v) => -120 + 240 * (Math.max(g.min, Math.min(g.max, v)) - g.min) / (g.max - g.min);
const arcD = (r, a0, a1) => { const p0 = [r * Math.sin(a0 * D2R), -r * Math.cos(a0 * D2R)], p1 = [r * Math.sin(a1 * D2R), -r * Math.cos(a1 * D2R)]; return `M${p0[0]} ${p0[1]} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${p1[0]} ${p1[1]}`; };
function buildMini(id) {
  const g = MG[id]; let h = `<circle r="46" cy="1.5" fill="#000" opacity=".4" filter="url(#castBig)"/>

  for (let k = 0; k <= 12; k++) { const a = -120 + 20 * k, s1 = Math.sin(a * D2R), c1 = -Math.cos(a * D2R); h += `<line x1="${s1 * 39}" y1="${c1 * 39}" x2="${s1 * (k % 3 ? 37.5 : 36.5)}" y2="${c1 * (k % 3 ? 37.5 : 36.5)}" stroke="#cdb68c" stroke-width=".5" opacity="${k % 3 ? .45 : .85}"/>`; }
  const ICON = {
