<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ormos asset kit</title><link rel="stylesheet" href="./preview.css"></head>
<body>
<canvas id="scene" aria-label="Interactive asset inspection"></canvas>
<header><div class="brand">ORMOS <span>ASSET LIBRARY</span></div><label>Asset <select id="asset"><option value="game-merchant">Game merchant · compatible assembly</option><option value="assembly">Assembled berth</option></select></label></header>
<aside><p id="family">ASSEMBLY</p><h1 id="title">Working berth</h1><p id="description">Modular assets placed using their exported anchors.</p><dl id="details"></dl>
<div class="controls" id="merchant-controls" hidden><label>Sail deployment <input id="deploy" type="range" min="0" max="1" step=".1" value="0"></label><label><input id="hatches" type="checkbox"> Open cargo hatches</label><label><input id="original-shell" type="checkbox"> Original game shell</label></div><div class="controls"><label>Detail <select id="lod"><option value="0">Near</option><option value="1">Distant</option></select></label><label><input id="collisions" type="checkbox"> Collision proxies</label><label><input id="anchors" type="checkbox"> Placement anchors</label><button id="reset">Reset camera</button></div><p id="status" role="status">Loading the library…</p></aside>
<footer>Drag to orbit · Scroll to zoom · Right-drag to pan <span id="stats"></span></footer>
<script type="module" src="./preview.ts"></script></body></html>
